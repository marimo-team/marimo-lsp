name: Update marimo version

on:
  schedule:
    - cron: "0 17 * * *" # 1pm EST (17:00 UTC)
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true

      - name: Read current Bundled marimo
        id: current_version
        run: |
          echo "version=$(uv run --no-project python -m scripts.marimo_version show)" >> "$GITHUB_OUTPUT"

      - name: Update Bundled marimo
        run: uv run --no-project python -m scripts.marimo_version update

      - name: Read updated Bundled marimo
        id: updated_version
        run: |
          echo "version=$(uv run --no-project python -m scripts.marimo_version show)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Bump marimo to ${{ steps.updated_version.outputs.version }}"
          title: "Bump marimo to ${{ steps.updated_version.outputs.version }}"
          labels: enhancement
          body: |
            Automated PR to bump the Bundled marimo from `${{ steps.current_version.outputs.version }}` to `${{ steps.updated_version.outputs.version }}`.

            Updates:
            - `pyproject.toml` — exact pin of the `marimo-base` dependency
            - `uv.lock` — refreshed by the marimo version-policy module

            Note: `[tool.marimo-lsp] minimum-kernel-version` is **not** changed by this workflow. Bump it manually when intentionally dropping support for an older marimo release.

            Created by the [`update-marimo-version`](./.github/workflows/update-marimo-version.yml) workflow.
          branch: "chore/update-marimo-version"
          base: "main"
          delete-branch: true
permissions: {}
